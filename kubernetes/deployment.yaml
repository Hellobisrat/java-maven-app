apiVersion: apps/v1
kind: Deployment
metadata:
  name: $APP_NAME
  labels:
    app: $APP_NAME
spec:
  replicas: 2
  selector:
    matchLabels:
      app: $APP_NAME
  template:
    metadata:
      labels:
        app: $APP_NAME
    spec:
      imagePullSecrets:
       - name: aws-registry-key
      containers:
        - name: $APP_NAME
          image: 125482557187.dkr.ecr.us-east-1.amazonaws.com/java-maven-app:${IMAGE_NAME}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080